[project]
name = "stadtstimme"
version = "0.1.0"
description = "Digitale Bürgerbeteiligung: 100 Punkte für die Prioritäten der eigenen Kommune."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
# Django konfiguriert Admin, Meta und Resources deklarativ über Klassenattribute.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["import_export.*", "tablib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# django-import-export bringt keine Typen mit; Unterklassen davon sind daher "Any".
# Admin-Klassen sind zur Laufzeit nicht generisch; Typparameter würden django-stubs-ext erfordern.
module = ["apps.catalog.resources", "apps.catalog.admin", "apps.access.admin", "apps.points.admin", "apps.proposals.admin"]
disallow_subclassing_any = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["apps.*.tests.*"]
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]
