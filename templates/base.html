{% load static %}<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StadtStimme{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>
  <header class="site-header">
    <a class="brand" href="{% url 'core:home' %}">StadtStimme</a>
    <nav aria-label="Zugang">
      {% if participant %}
        <a href="{% url 'access:account' %}">Mein Bereich</a>
        <form method="post" action="{% url 'access:logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="link-button">Abmelden</button>
        </form>
      {% else %}
        <a href="{% url 'access:redeem' %}">Code eingeben</a>
      {% endif %}
    </nav>
  </header>
  <main id="inhalt" class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
