# Startet StadtStimme vollständig mit: docker compose up
# Alle Werte haben Demo-Standards; eigene Werte über eine .env-Datei (siehe .env.example).
# Ports sind nur an 127.0.0.1 gebunden: Die Demo ist von außen nicht erreichbar.

services:
  app:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-demo-only-insecure-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      STADTSTIMME_DEMO_MODE: ${STADTSTIMME_DEMO_MODE:-true}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-demo}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-demo}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-stadtstimme}
      POSTGRES_USER: ${POSTGRES_USER:-stadtstimme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stadtstimme}
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stadtstimme}
      POSTGRES_USER: ${POSTGRES_USER:-stadtstimme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stadtstimme}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
