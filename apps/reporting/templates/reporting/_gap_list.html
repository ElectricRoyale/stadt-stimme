<section class="ss-card res-list" aria-labelledby="{{ list_id }}">
  <h2 id="{{ list_id }}">{{ title }}</h2>
  {% if hint %}<p class="res-list__hint">{{ hint }}</p>{% endif %}
  <ol>
    {% for row in rows %}
      <li>
        <a class="res-list__item" href="?ort={{ row.key }}#res-detail" data-select="{{ row.key }}"{% if row.key == selected.key %} aria-current="true"{% endif %}>
          <span class="res-mark cat-{{ row.category.color }}{% if row.is_theme %} res-mark--theme{% endif %}" aria-hidden="true"></span>
          <span class="res-list__name">{{ row.name }}<span class="ss-visually-hidden">: Bürger {{ row.wish }} Prozent, Ausgaben {{ row.spend }} Prozent, Unterschied</span></span>
          <span class="ss-tag gap-tag gap-tag--{{ row.tone }}">{{ row.gap_text }}</span>
        </a>
      </li>
    {% empty %}
      <li class="res-list__empty">Noch keine Einträge.</li>
    {% endfor %}
  </ol>
</section>
