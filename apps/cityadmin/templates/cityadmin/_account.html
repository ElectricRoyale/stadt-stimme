{# Angemeldete Person der Verwaltung und Abmelden. compact=True für die Kopfzeile am Telefon. #}
<div class="shell-account va-account{% if compact %} shell-account--compact{% endif %}">
  {% if not compact %}
    <p class="va-account__who"><strong>{{ request.user.get_full_name|default:request.user.get_username }}</strong><span>Stadtverwaltung</span></p>
  {% endif %}
  <form method="post" action="{% url 'access:logout' %}" class="inline-form">
    {% csrf_token %}
    <button type="submit" class="shell-account__logout" aria-label="Abmelden" title="Abmelden">
      {% include "partials/icon.html" with name="log-out" size=18 %}
    </button>
  </form>
</div>
