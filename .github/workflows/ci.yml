name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typen, Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stadtstimme
          POSTGRES_USER: stadtstimme
          POSTGRES_PASSWORD: stadtstimme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stadtstimme"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (Lint)
        run: ruff check .
      - name: Ruff (Format)
        run: ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Django-Checks und fehlende Migrationen
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  plug-and-play:
    name: Plug and Play (docker compose up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stack starten wie die Prüfer
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health-Check
        run: curl --fail --silent http://localhost:8000/healthz/
      - name: Startseite und Demo-Admin
        run: |
          curl --fail --silent http://localhost:8000/ | grep -q "StadtStimme"
          curl --silent -o /dev/null -w "%{http_code}" http://localhost:8000/admin/ | grep -q 302
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs
      - name: Aufräumen
        if: always()
        run: docker compose down -v

  apple-silicon:
    name: Image-Build für arm64 (Apple Silicon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64
        run: docker buildx build --platform linux/arm64 .
